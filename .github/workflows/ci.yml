name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: conciliacao_teste
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d conciliacao_teste"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar GnuCOBOL e cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol gcc python3 postgresql-client

      - name: Executar as 10 suites COBOL
        run: bash testes/testar-tudo.sh

      # Executa todos os scripts SQL na ordem numerada. O 04 valida
      # as classificacoes e os totais das views do 03; antes ele so
      # era executado manualmente.
      - name: Validar scripts SQL no PostgreSQL 18
        env:
          PGPASSWORD: postgres
        run: |
          for arquivo in \
            sql/01-estrutura.sql \
            sql/02-dados-teste.sql \
            sql/03-views.sql \
            sql/04-validacao.sql \
            sql/05-restricoes.sql \
            sql/06-testar-restricoes.sql
          do
            echo "Executando $arquivo"
            psql -h localhost -U postgres -d conciliacao_teste \
              -v ON_ERROR_STOP=1 -f "$arquivo"
          done
